name: CD
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Subir la versión en el README
        if: github.event_name == 'push'
        run: |
          CUR="$(grep -oE '^AppVersion-[0-9]+' README.md | head -1 | grep -oE '[0-9]+$')"
          NEW=$((CUR + 1))
          NOW="$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          sed -i -E "s/^AppVersion-[0-9]+.*/AppVersion-$NEW - $NOW/" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Version AppVersion-$NEW"
          git push
      - name: Evento sin push
        if: github.event_name != 'push'
        run: echo "Evento ${{ github.event_name }}. La versión solo sube al hacer push a main."

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Validar PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "PROD_TOKEN valido: coincide con LOCAL_PROD_TOKEN"
          } else {
            Write-Host "PROD_TOKEN NO coincide con LOCAL_PROD_TOKEN"
            exit 1
          }
