name: CD
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Subir la versión en el README
        if: github.event_name == 'push'
        run: |
          Write-Host "Longitud secret: $($env:PROD_TOKEN.Length)"
          Write-Host "Longitud local: $($env:LOCAL_PROD_TOKEN.Length)"
          Write-Host "Local: [$($env:LOCAL_PROD_TOKEN)]"
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "PROD_TOKEN valido: coincide con LOCAL_PROD_TOKEN"
          } else {
            Write-Host "PROD_TOKEN NO coincide con LOCAL_PROD_TOKEN"
            exit 1
          }
